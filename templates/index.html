<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Казино</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2b2b40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .casino-container {
            background: #252538;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 450px;
            width: 100%;
            border: 2px solid #3d3d5c;
        }
        .balance-box {
            font-size: 20px;
            margin-bottom: 25px;
            background: #1a1a26;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #4a4a6a;
        }
        .balance-amount {
            color: #4cd137;
            font-weight: bold;
        }
        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .slot-window {
            width: 90px;
            height: 110px;
            background: #15151e;
            border: 3px solid #ff4757;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
        }
        .spin-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }
        .spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 71, 87, 0.6);
        }
        .spin-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            min-height: 27px;
        }
        .rules {
            margin-top: 25px;
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
            background: #1a1a26;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="casino-container">
        <h1>🎰 Мини-Казино</h1>
        <div class="balance-box">Баланс: <span id="balance" class="balance-amount">1500</span> баллов</div>
        
        <div class="slot-machine">
            <div id="slot1" class="slot-window">🍒</div>
            <div id="slot2" class="slot-window">🍋</div>
            <div id="slot3" class="slot-window">💎</div>
        </div>

        <button id="spinBtn" class="spin-btn" onclick="spinSlots()">КРУТИТЬ (150)</button>
        <div id="message" class="message">Сделайте ставку!</div>

        <div class="rules">
            <b>Правила:</b> Стоимость прокрута — 150 баллов.<br>
            🍒 🍒 🍒 = 50<br>
            🍋 🍋 🍋 = 100<br>
            💎 💎 💎 = 300
        </div>
    </div>

    <script>
        const symbolsPool = ['🍒', '🍋', '💎'];

        async function spinSlots() {
            let currentBalance = parseInt(document.getElementById('balance').innerText);
            if (currentBalance < 150) {
                document.getElementById('message').innerText = 'Недостаточно баллов!';
                return;
            }

            const spinBtn = document.getElementById('spinBtn');
            const messageEl = document.getElementById('message');
            
            spinBtn.disabled = true;
            messageEl.style.color = '#fff';
            messageEl.innerText = 'Вращаем...';

            let animationInterval = setInterval(() => {
                document.getElementById('slot1').innerText = symbolsPool[Math.floor(Math.random() * symbolsPool.length)];
                document.getElementById('slot2').innerText = symbolsPool[Math.floor(Math.random() * symbolsPool.length)];
                document.getElementById('slot3').innerText = symbolsPool[Math.floor(Math.random() * symbolsPool.length)];
            }, 80);

            try {
                const response = await fetch('/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: currentBalance })
                });
                
                const data = await response.json();

                setTimeout(() => {
                    clearInterval(animationInterval);
                    document.getElementById('slot1').innerText = data.result[0];
                    document.getElementById('slot2').innerText = data.result[1];
                    document.getElementById('slot3').innerText = data.result[2];

                    document.getElementById('balance').innerText = data.balance;
                    
                    if (data.won_amount > 0) {
                        messageEl.style.color = '#4cd137';
                        messageEl.innerText = data.message;
                    } else {
                        messageEl.style.color = '#ff6b81';
                        messageEl.innerText = data.message;
                    }
                    spinBtn.disabled = false;
                }, 1000);

            } catch (error) {
                clearInterval(animationInterval);
                messageEl.innerText = 'Ошибка соединения с сервером!';
                spinBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
